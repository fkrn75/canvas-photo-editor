<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Canvas Photo Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 전체 앱 레이아웃: 메뉴바 / 옵션바 / 본문(툴바·캔버스·우측패널) / 상태바 -->
  <div id="app">
    <!-- 상단 메뉴바 (menu-bar.js가 채움) -->
    <div id="menubar" class="menubar"></div>

    <!-- 현재 도구 옵션바 (options-bar.js가 채움) -->
    <div id="optionsbar" class="optionsbar"></div>

    <div class="main">
      <!-- 좌측 툴바 + 색상 스와치 (toolbar.js / color-panel.js가 채움) -->
      <div class="toolcolumn">
        <div id="toolbar" class="toolbar"></div>
        <div id="colorbox" class="colorbox"></div>
      </div>

      <!-- 좌측 도킹존(② 기본 비어있음; 패널을 끌어다 놓으면 채워진다. panel-dock이 data-dock으로 식별) -->
      <div class="dock dock-left empty" data-dock="left"></div>

      <!-- 중앙 캔버스 뷰포트 -->
      <div id="viewport" class="viewport">
        <!-- 합성 결과가 그려지는 표시 캔버스 -->
        <canvas id="view" tabindex="0"></canvas>
        <!-- 텍스트 도구 입력용 오버레이 (text-tool-v.js가 사용) -->
        <div id="text-overlay"></div>
        <!-- 노트(주석) 마커+팝업 오버레이 (notes-overlay.js가 사용) -->
        <div id="notes-overlay"></div>
      </div>

      <!-- 우측 패널: 레이어(위, 가장 자주 사용) + 기타 + 최근 이미지(아래). 각 패널 헤더 클릭으로 접기/펴기(panel-collapse.js) -->
      <div class="rightpanel dock" data-dock="right">
        <div id="layers-panel" class="panel"></div>
        <div id="swatches-panel" class="panel"></div>
        <div id="styles-panel" class="panel"></div>
        <div id="history-panel" class="panel"></div>
        <div id="channels-panel" class="panel"></div>
        <div id="paths-panel" class="panel"></div>
        <div id="character-panel" class="panel"></div>
        <div id="shape-panel" class="panel"></div>
        <div id="brushes-panel" class="panel"></div>
        <div id="actions-panel" class="panel"></div>
        <div id="tool-presets-panel" class="panel"></div>
        <div id="file-browser-panel" class="panel"></div>
      </div>

      <!-- 하단 도킹존(② 기본 비어있음) -->
      <div class="dock dock-bottom empty" data-dock="bottom"></div>
    </div>

    <!-- 하단 상태바 (app.js가 갱신) -->
    <div id="statusbar" class="statusbar">
      <span id="status-zoom">100%</span>
      <span id="status-coord">-</span>
      <span id="status-size">-</span>
      <span id="status-msg" class="status-msg"></span>
    </div>
  </div>

  <!-- 플로팅 패널을 담는 레이어(② 패널 플로팅). 패널 자체가 position:fixed라 위치는 무관 -->
  <div class="float-layer"></div>

  <!-- 숨겨진 파일 선택 입력 (file-io.js가 사용) -->
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden multiple>

  <!-- 모달 다이얼로그 루트 (dialogs.js가 사용) -->
  <div id="dialog-root"></div>

  <!-- 단일 진입점: 모든 모듈은 app.js에서 import 한다 (인라인 스크립트 금지 → MV3 CSP 준수) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
